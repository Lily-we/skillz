{% load static %}
<!doctype html>
<html lang="en" class="">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Skillz — Company X readiness{% endblock %}</title>

  <!-- Apply theme BEFORE Tailwind loads: prevents flash + makes the toggle instant -->
  <script>
    (function () {
      const t = localStorage.getItem("theme") || "dark";
      if (t === "dark") document.documentElement.classList.add("dark");
    })();
  </script>

  <script>
    window.tailwind = { config: { darkMode: 'class' } };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://cdn.jsdelivr.net/npm/tsparticles@2.12.0/tsparticles.bundle.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,450;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Inter', -apple-system, sans-serif; }
    .font-display { font-family: 'Fraunces', Georgia, serif; }
    .font-mono { font-family: 'IBM Plex Mono', monospace; }

    .fade-in { opacity: 0; transform: translateY(18px); transition: opacity .9s ease, transform .9s ease; }
    .fade-in.show { opacity: 1; transform: translateY(0); }
    .float { animation: float 6s ease-in-out infinite; }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-14px)} }

    /* Required-level tick mark on a competency track — the recurring
       "threshold" motif: same idea whether it's a progress rail or a
       skill bar. Blue only, no amber. */
    .gauge-track { position: relative; height: 8px; border-radius: 6px; }
    .gauge-tick {
      position: absolute; top: -4px; bottom: -4px; width: 2px;
      background: #2563EB;
    }
    .dark .gauge-tick { background: #7FA8FF; }

    input[type="text"], input[type="password"], input[type="email"], input[type="search"], textarea, select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(148,163,184,.55);
      background: rgba(255,255,255,.75);
      outline: none;
    }
    .dark input[type="text"], .dark input[type="password"], .dark input[type="email"], .dark input[type="search"], .dark textarea, .dark select {
      border-color: rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      color: #fff;
    }
    label { display:block; font-weight:600; margin-bottom:6px; }
  </style>

  {% block extra_head %}{% endblock %}
</head>

<body class="bg-slate-50 text-slate-900 dark:bg-[#0A0E1C] dark:text-slate-100 overflow-x-hidden">

  <!-- LIGHT MODE BACKGROUND: graph-paper grid, blue-only accent glow -->
  <div class="fixed inset-0 -z-30 pointer-events-none dark:hidden">
    <div class="absolute inset-0"
         style="
           background:
             radial-gradient(900px 500px at 15% 10%, rgba(37,99,235,.10), transparent 60%),
             radial-gradient(900px 600px at 90% 20%, rgba(14,165,233,.09), transparent 60%),
             radial-gradient(1000px 700px at 50% 95%, rgba(30,58,138,.07), transparent 60%),
             linear-gradient(to right, rgba(15,23,42,.05) 1px, transparent 1px),
             linear-gradient(to bottom, rgba(15,23,42,.05) 1px, transparent 1px);
           background-size:
             auto, auto, auto,
             28px 28px, 28px 28px;
         ">
    </div>
  </div>

  <!-- DARK MODE BACKGROUND: blurred blobs, blue/navy/sky only -->
  <div class="fixed inset-0 -z-30 pointer-events-none hidden dark:block">
    <div class="absolute -top-32 -left-32 w-[520px] h-[520px] rounded-full blur-3xl opacity-25 bg-blue-600"></div>
    <div class="absolute -top-24 -right-40 w-[560px] h-[560px] rounded-full blur-3xl opacity-20 bg-sky-500"></div>
    <div class="absolute bottom-[-160px] left-[25%] w-[640px] h-[640px] rounded-full blur-3xl opacity-15 bg-blue-900"></div>
  </div>

  <!-- particles -->
  <div id="tsparticles" class="fixed inset-0 -z-20 pointer-events-none"></div>

  <!-- Navbar -->
  <nav class="relative z-20 flex justify-between items-center px-6 lg:px-16 py-4
              bg-white/70 dark:bg-[#0A0E1C]/70 backdrop-blur-md border-b border-slate-200 dark:border-white/10">
    <a href="{% url 'home' %}" class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl grid place-items-center
                  bg-blue-600/15 text-blue-700 dark:bg-sky-400/15 dark:text-sky-300
                  border border-slate-200 dark:border-white/10 font-display italic">S</div>
      <div>
        <div class="text-lg font-display font-semibold tracking-tight text-blue-700 dark:text-sky-300">Skillz</div>
        <div class="text-xs font-mono text-slate-500 dark:text-slate-400 uppercase tracking-wide">Company X · Junior Python Developer</div>
      </div>
    </a>

    <div class="flex items-center gap-3">
      <button id="themeBtn"
              class="px-3 py-2 rounded-lg border border-slate-200 dark:border-white/10
                     bg-white/60 dark:bg-white/5 hover:bg-white dark:hover:bg-white/10 transition"
              type="button" title="Toggle theme">🌓</button>
    </div>
  </nav>

  <main class="relative z-10">
    {% block content %}{% endblock %}
  </main>

  <script>
    // Fade-in
    window.addEventListener("DOMContentLoaded", () => {
      document.querySelectorAll(".fade-in").forEach((el, i) => {
        setTimeout(() => el.classList.add("show"), i * 180);
      });
    });

    // Theme toggle (persisted)
    const root = document.documentElement;
    const themeBtn = document.getElementById("themeBtn");

    function setTheme(t){
      if(t === "dark") root.classList.add("dark");
      else root.classList.remove("dark");
      localStorage.setItem("theme", t);
      themeBtn.textContent = t === "dark" ? "🌙" : "☀️";
      initParticles();
    }

    setTheme(localStorage.getItem("theme") || "dark");

    themeBtn.addEventListener("click", () => {
      setTheme(root.classList.contains("dark") ? "light" : "dark");
    });

    // particles recolor by theme — blue/dark-blue in dark mode, navy ink in light mode, never amber/warm
    function initParticles(){
      const isDark = root.classList.contains("dark");
      const nodeColor = isDark ? "#EAF2FF" : "#132A6E";
      const linkColor = isDark ? "#7FA8FF" : "#2C4B96";

      tsParticles.load("tsparticles", {
        background: { color: "transparent" },
        particles: {
          number: { value: 60, density: { enable: true, area: 900 } },
          color: { value: nodeColor },
          opacity: { value: 0.7 },
          size: { value: 2.2 },
          move: { enable: true, speed: 0.5, outModes: { default: "bounce" } },
          links: { enable: true, distance: 150, color: linkColor, opacity: 0.4, width: 1 }
        },
        interactivity: {
          events: { onHover: { enable: true, mode: "grab" } },
          modes: { grab: { distance: 170, links: { opacity: 0.7 } } }
        },
        responsive: [
          { maxWidth: 720, options: { particles: { number: { value: 32 } } } }
        ],
        detectRetina: true
      });
    }
  </script>

  {% block extra_scripts %}{% endblock %}
</body>
</html>
