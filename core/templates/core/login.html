{% extends "core/base.html" %}
{% block title %}Log in — Skillz{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto px-6 py-24">
  <h1 class="font-display font-medium text-3xl mb-8 fade-in">Log in</h1>

  <form method="post" class="space-y-4 fade-in">
    {% csrf_token %}
    {% for field in form %}
      <div>
        <label>{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}
          <p class="text-xs text-red-500 mt-1">{{ field.errors|striptags }}</p>
        {% endif %}
      </div>
    {% endfor %}
    <button type="submit"
            class="w-full px-6 py-3 rounded-xl bg-blue-600 hover:bg-blue-700 dark:bg-sky-400 dark:hover:bg-sky-300 text-white dark:text-slate-950 font-mono text-sm font-semibold transition">
      Log in
    </button>
  </form>

  <p class="text-sm text-slate-500 dark:text-slate-400 mt-6 fade-in">
    No account yet? <a href="{% url 'register' %}" class="text-blue-600 dark:text-sky-400 hover:underline">Sign up</a>
  </p>
</div>
{% endblock %}
